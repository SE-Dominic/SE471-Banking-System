<div id="deposit-form-template">
    <header>
        <h1>Deposit Funds</h1>
    </header>
    <div id="deposit-form">
        <form onsubmit="event.preventDefault(); confirmDepositEndpoint();">
            <label for="deposit-amount-input">Amount to Deposit:</label>
            <input type="number" id="deposit-amount-input" name="depositAmount" min="0.01" step="0.01" required>
            <br>
            <button class="btn" type="submit">Submit Deposit</button>
            <a class="btn" href="#" data-page="accounts">Cancel</a>
        </form>
    </div>
</div>
