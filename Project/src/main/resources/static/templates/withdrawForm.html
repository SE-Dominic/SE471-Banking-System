<div id="withdraw-form-template">
  <header>
    <h1>Withdraw Funds</h1>
  </header>
  <div id="withdraw-form">
    <form onsubmit="event.preventDefault(); confirmWithdrawEndpoint();">
      <label for="withdraw-amount-input">Amount to Withdraw:</label>
      <input type="number" id="withdraw-amount-input" name="withdrawAmount" min="0.01" step="0.01" required>
      <br>
      <button class="btn" type="submit">Submit Withdrawal</button>
      <a class="btn" href="#" data-page="accounts">Cancel</a>
    </form>
  </div>
</div>
