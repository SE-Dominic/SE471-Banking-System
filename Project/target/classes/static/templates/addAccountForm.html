<!-- Other page templates -->
<div id="add-account-form-template">
    <h1>Connect a New Bank Account</h1>
    <form id="add-account-form">
        <label for="account-name">Account Name:</label>
        <input type="text" id="account-name" name="account-name" placeholder="Enter account name" required>

        <label for="account-type">Account Type:</label>
        <select id="account-type" name="account-type" required>
            <option value="checking">Checking</option>
            <option value="savings">Savings</option>
        </select>

        <label for="initial-deposit">Initial Deposit:</label>
        <input type="number" id="initial-deposit" name="initial-deposit" placeholder="Enter initial deposit" required>

        <button type="submit" class="btn">Create Account</button>
    </form>
    <nav>
        <ul>
            <li><a href='#' data-page="accounts" class="btn">Back to Accounts</a></li>
        </ul>
    </nav>
</div>

<style>
  /* Styling for the form */
  form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-width: 400px;
    margin: 0 auto;
  }

  label {
    font-weight: bold;
  }

  input, select {
    padding: 0.5rem;
    border: 1px solid #ccc;

  button {
    align-self: center;
  }
</style>
